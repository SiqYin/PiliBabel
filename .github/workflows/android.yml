name: Android

on:
    pull_request:
        types:
            - opened
            - synchronize
            - reopened
            - ready_for_review
        paths-ignore:
            - "**.md"
    workflow_dispatch:
        inputs:
            build_android:
                description: "Build Android"
                required: false
                default: true
                type: boolean

            tag:
                description: "tag"
                required: false
                default: ""
                type: string

jobs:
    android:
        if: ${{ github.event_name == 'pull_request' || github.event.inputs.build_android == 'true' }}
        name: Release Android
        runs-on: ubuntu-latest
        permissions: write-all

        steps:
            - name: 代码迁出
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: 构建Java环境
              uses: actions/setup-java@v5
              with:
                  distribution: "zulu"
                  java-version: "17"
                  cache: "gradle"
                  cache-dependency-path: |
                      android/*.gradle*
                      android/**/gradle-wrapper.properties

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              id: flutter-action
              with:
                  channel: stable
                  flutter-version-file: pubspec.yaml
                  cache: true

            - name: revert new overscrollindicator
              working-directory: ${{ env.FLUTTER_ROOT }}
              run: |
                git config --global user.name "ci"
                git config --global user.email "example@example.com"
                git stash || true
                git revert 362b1de29974ffc1ed6faa826e1df870d7bec75f --no-edit
                git reset --soft HEAD~1
                git stash pop || true
              continue-on-error: true

            - name: apply bottom sheet patch
              working-directory: ${{ env.FLUTTER_ROOT }}
              run: git apply $GITHUB_WORKSPACE/lib/scripts/bottom_sheet_patch.diff || true
              continue-on-error: true

            - name: apply modal barrier patch
              working-directory: ${{ env.FLUTTER_ROOT }}
              run: git apply $GITHUB_WORKSPACE/lib/scripts/modal_barrier_patch.diff || true
              continue-on-error: true

            - name: apply mouse cursor patch
              working-directory: ${{ env.FLUTTER_ROOT }}
              run: git apply $GITHUB_WORKSPACE/lib/scripts/mouse_cursor_patch.diff || true
              continue-on-error: true

            - name: Write key
              if: github.event_name == 'workflow_dispatch'
              run: |
                  if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
                    echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
                    echo storeFile='key.jks' >> android/key.properties
                    echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
                    echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
                    echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties
                  fi

            - name: Set and Extract version
              shell: pwsh
              run: lib/scripts/build.ps1 android

            - name: Cache Android NDK
              # Flutter 要的 NDK 28.2 不在 runner 镜像预装列表里（预装 27.3 / 29.0 / 30.0），
              # 每次构建都要现下约 2.6 GB，而这个下载在 CI 上时好时坏（2026-10-10 期间连续
              # 多轮卡在 10~16% 后超时）。这里把成功下载的那份缓存下来，之后的构建就不再
              # 依赖网络。不能靠改 ndkVersion 绕开：app_links 与 android_file_picker 都
              # 声明需要 28.2，AGP 要求工程与所有插件的 NDK 版本一致，改低会直接报
              # "Your project is configured with Android NDK ..."。
              # key 用 pubspec 的哈希：NDK 版本由 Flutter 决定，而 pubspec 钉死了 flutter
              # 版本，Flutter 一升级缓存即自动失效。路径即 runner 镜像的 ANDROID_HOME。
              uses: actions/cache@v4
              continue-on-error: true
              with:
                path: /usr/local/lib/android/sdk/ndk
                key: android-ndk-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}

            - name: flutter build apk
              run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --pub

            - name: rename
              run: |
                  for file in build/app/outputs/flutter-apk/app-*-release.apk; do
                    abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
                    mv "$file" "PiliNara_android_${{ env.version }}_${abi}.apk"
                  done
              shell: bash

            - name: Release
              if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: ${{ github.event.inputs.tag }}
                  name: ${{ github.event.inputs.tag }}
                  target_commitish: ${{ github.sha }}
                  files: |
                      PiliNara_android_*.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_arm64-v8a
                  path: PiliNara_android_*_arm64-v8a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_armeabi-v7a
                  path: PiliNara_android_*_armeabi-v7a.apk

            - name: 上传
              uses: actions/upload-artifact@v7
              with:
                  archive: false
                  name: Android_x86_64
                  path: PiliNara_android_*_x86_64.apk
