name: AI UI Translate - Debug APK

# AI 界面翻译分支专用：push 到本分支或手动触发即产出 debug APK。
# 关键点：本 App 依赖打了补丁的 Flutter SDK 与 material_ui/cupertino_ui，
# 正确做法是调用仓库自带的 lib/scripts/patch.ps1（框架+包补丁）与 build.ps1
# （版本号 + 生成 pili_release.json），再 flutter build。失败时把真实报错
# 抛成 annotation / step summary，便于无 token 远程诊断。
on:
  push:
    branches:
      - feat/ai-ui-translate
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

env:
  FLUTTER_VERSION_FILE: pubspec.yaml

jobs:
  android-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: ${{ env.FLUTTER_VERSION_FILE }}
          cache: true

      - name: Prep env (git ownership / analytics / FLUTTER_ROOT)
        run: |
          git config --global --add safe.directory '*'
          flutter --version
          FR="$(cd "$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")" && pwd)"
          echo "FLUTTER_ROOT=$FR" >> "$GITHUB_ENV"
          echo "exported FLUTTER_ROOT=$FR"

      - name: Resolve deps
        run: flutter pub get

      - name: Patch Flutter + material_ui (patch.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./lib/scripts/patch.ps1 -platform android
        continue-on-error: false

      - name: Version + pili_release.json (build.ps1)
        shell: pwsh
        run: ./lib/scripts/build.ps1 android

      - name: Cache Android NDK
        # Flutter 要的 NDK 28.2 不在 runner 镜像预装列表里（预装 27.3 / 29.0 / 30.0），
        # 每次构建都要现下约 2.6 GB，而这个下载在 CI 上时好时坏（2026-10-10 期间连续
        # 多轮卡在 10~16% 后超时）。这里把成功下载的那份缓存下来，之后的构建就不再
        # 依赖网络。不能靠改 ndkVersion 绕开：app_links 与 android_file_picker 都
        # 声明需要 28.2，AGP 要求工程与所有插件的 NDK 版本一致，改低会直接报
        # "Your project is configured with Android NDK ..."。
        # key 用 pubspec 的哈希：NDK 版本由 Flutter 决定，而 pubspec 钉死了 flutter
        # 版本，Flutter 一升级缓存即自动失效。路径即 runner 镜像的 ANDROID_HOME。
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: android-ndk-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}

      - name: Build Debug APK
        run: |
          set +e
          code=1
          for attempt in 1 2 3 4; do
            echo "### 尝试 $attempt/4：flutter build apk"
            flutter build apk --debug --dart-define-from-file=pili_release.json --pub > build.log 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then break; fi
            echo "::warning title=BuildRetry::第 $attempt 次 flutter build 失败（exit=$code）"
            [ "$attempt" -lt 4 ] && sleep 20
          done
          echo "### flutter build apk (exit=$code)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 180 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -iE "error:|error -|FAILURE|What went wrong|Execution failed|^e: |BUILD FAILED|Target .* failed|Keystore|NDK|Could not|not found" build.log | head -n 40 | \
            while IFS= read -r line; do
              msg=$(printf '%s' "$line" | sed 's/%/%25/g; s/:/%3A/g')
              echo "::error title=BuildError::$msg"
            done
          if [ "$code" -ne 0 ]; then exit 1; fi

      - name: Rename Debug APK
        shell: bash
        run: |
          mkdir -p output
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            mv "build/app/outputs/flutter-apk/app-debug.apk" "output/PiliNara_ui-translate_debug.apk"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ui-translate-debug-apk
          path: output/PiliNara_ui-translate_debug.apk
