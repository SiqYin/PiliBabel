name: AI UI Translate - Debug APK

# 专供 AI 界面翻译分支：push 到本分支或手动触发即产出 debug APK，
# 并在失败时把真实报错抛成 annotation / step summary，便于无 token 诊断。
on:
  push:
    branches:
      - feat/ai-ui-translate
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  android-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Ensure pili_release.json exists
        run: |
          if [ ! -f pili_release.json ]; then
            echo '{}' > pili_release.json
            echo "created placeholder pili_release.json"
          fi

      - name: Revert overscrollindicator patch
        working-directory: ${{ env.FLUTTER_ROOT }}
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git stash || true
          git revert 362b1de29974ffc1ed6faa826e1df870d7bec75f --no-edit || true
          git reset --soft HEAD~1 || true
          git stash pop || true
        continue-on-error: true

      - name: Apply framework patches
        working-directory: ${{ env.FLUTTER_ROOT }}
        run: |
          for p in bottom_sheet_patch modal_barrier_patch mouse_cursor_patch; do
            git apply "$GITHUB_WORKSPACE/lib/scripts/$p.diff" || true
          done

      - name: Set and extract version
        shell: pwsh
        run: lib/scripts/build.ps1 android
        continue-on-error: true

      # ---- 诊断闸门：先只跑 Dart 静态分析，快速区分「代码错」还是「环境错」----
      - name: Analyze (hard gate + annotate)
        run: |
          flutter pub get
          set +e
          flutter analyze > analyze.log 2>&1
          code=$?
          echo "### flutter analyze (exit=$code)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error" analyze.log | head -n 60 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          # 把 error 行抛成 annotation（public annotations API 可读）
          grep -E "error -|error •| error " analyze.log | head -n 40 | \
            while IFS= read -r line; do
              msg=$(printf '%s' "$line" | sed 's/%/%25/g; s/:/%3A/g')
              echo "::error title=AnalyzeError::$msg"
            done
          echo "ANALYZE_EXIT=$code"
          if [ "$code" -ne 0 ]; then
            echo "analyze 失败：优先怀疑本次 Dart 改动"
          fi
          # 故意不因 analyze 失败而中断，继续尝试真机编译以暴露 gradle/native 问题

      - name: Build Debug APK
        run: |
          set +e
          flutter build apk --debug --dart-define-from-file=pili_release.json --pub > build.log 2>&1
          code=$?
          echo "### flutter build apk (exit=$code)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 150 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -iE "error:|FAILURE|What went wrong|Execution failed|e: |BUILD FAILED|Target .* failed|Keystore|NDK|Could not" build.log | head -n 40 | \
            while IFS= read -r line; do
              msg=$(printf '%s' "$line" | sed 's/%/%25/g; s/:/%3A/g')
              echo "::error title=BuildError::$msg"
            done
          echo "BUILD_EXIT=$code"
          if [ "$code" -ne 0 ]; then
            exit 1
          fi

      - name: Rename Debug APK
        shell: bash
        run: |
          mkdir -p output
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            mv "build/app/outputs/flutter-apk/app-debug.apk" "output/PiliNara_ui-translate_debug.apk"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ui-translate-debug-apk
          path: output/PiliNara_ui-translate_debug.apk
