name: AI UI Translate - Debug APK

# AI 界面翻译分支专用：push 到本分支或手动触发即产出 debug APK。
# 关键点：本 App 依赖打了补丁的 Flutter SDK 与 material_ui/cupertino_ui，
# 正确做法是调用仓库自带的 lib/scripts/patch.ps1（框架+包补丁）与 build.ps1
# （版本号 + 生成 pili_release.json），再 flutter build。失败时把真实报错
# 抛成 annotation / step summary，便于无 token 远程诊断。
on:
  push:
    branches:
      - feat/ai-ui-translate
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

env:
  FLUTTER_VERSION_FILE: pubspec.yaml

jobs:
  android-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: ${{ env.FLUTTER_VERSION_FILE }}
          cache: true

      - name: Prep env (git ownership / analytics / FLUTTER_ROOT)
        run: |
          git config --global --add safe.directory '*'
          flutter --version
          FR="$(cd "$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")" && pwd)"
          echo "FLUTTER_ROOT=$FR" >> "$GITHUB_ENV"
          echo "exported FLUTTER_ROOT=$FR"

      - name: Resolve deps
        run: flutter pub get

      - name: Patch Flutter + material_ui (patch.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./lib/scripts/patch.ps1 -platform android
        continue-on-error: false

      - name: Version + pili_release.json (build.ps1)
        shell: pwsh
        run: ./lib/scripts/build.ps1 android

      - name: Use the runner's preinstalled NDK
        # Flutter 3.47 默认的 ndkVersion（28.2）不在 GitHub runner 镜像的预装列表里
        # （预装的是 27.3.13750724 / 29.0.14206865 / 30.0.16248370），于是每次构建都要
        # 去 dl.google.com 现下 2.6 GB。那个下载从 2026-10-10 起在 CI 上持续卡死
        # （进度条停在 10~16% 后超时），Android 构建在编译 Dart 之前就全挂。
        # 这里改成复用镜像自带的默认 NDK，构建过程不再依赖网络。
        # 前提：本项目 Android 侧没有 externalNativeBuild / cmake / jniLibs，
        # 构建期不编译原生代码，NDK 仅供 AGP 处理 AAR 内的预编译 .so。
        run: |
          ndk_dir="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK:-}}}"
          ver="$(basename "$ndk_dir")"
          if [ -n "$ver" ] && [ -d "$ndk_dir" ]; then
            echo "使用 runner 预装 NDK：$ver"
            echo "ORG_GRADLE_PROJECT_piliNdkVersion=$ver" >> "$GITHUB_ENV"
          else
            echo "::warning title=NDK::runner 未提供预装 NDK，回退到 Flutter 默认版本（将触发下载）"
          fi
      - name: Build Debug APK
        run: |
          set +e
          flutter build apk --debug --dart-define-from-file=pili_release.json --pub > build.log 2>&1
          code=$?
          echo "### flutter build apk (exit=$code)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 180 build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -iE "error:|error -|FAILURE|What went wrong|Execution failed|^e: |BUILD FAILED|Target .* failed|Keystore|NDK|Could not|not found" build.log | head -n 40 | \
            while IFS= read -r line; do
              msg=$(printf '%s' "$line" | sed 's/%/%25/g; s/:/%3A/g')
              echo "::error title=BuildError::$msg"
            done
          if [ "$code" -ne 0 ]; then exit 1; fi

      - name: Rename Debug APK
        shell: bash
        run: |
          mkdir -p output
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            mv "build/app/outputs/flutter-apk/app-debug.apk" "output/PiliNara_ui-translate_debug.apk"
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ui-translate-debug-apk
          path: output/PiliNara_ui-translate_debug.apk
