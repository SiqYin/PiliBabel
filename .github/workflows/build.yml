name: Build

on:
  # pull_request:
  #     types:
  #         - opened
  #         - synchronize
  #         - reopened
  #         - ready_for_review
  #     paths-ignore:
  #         - "**.md"
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android"
        required: false
        default: true
        type: boolean
      build_ios:
        description: "Build iOS"
        required: false
        default: false
        type: boolean
      build_mac:
        description: "Build Mac"
        required: false
        default: false
        type: boolean
      build_win_x64:
        description: "Build Win-x64"
        required: false
        default: false
        type: boolean
      build_linux_x64:
        description: "Build Linux-x64"
        required: false
        default: false
        type: boolean
      tag:
        description: "tag"
        required: false
        default: ""
        type: string

jobs:
  android:
    if: ${{ (github.event_name == 'pull_request' && github.repository == 'Starfallan/PiliNara') || github.event.inputs.build_android == 'true' }}
    name: Release Android
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android
        continue-on-error: true

      - name: Write key
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ ! -z "${{ secrets.SIGN_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.SIGN_KEYSTORE_BASE64 }}" | base64 --decode > android/app/key.jks
            echo storeFile='key.jks' >> android/key.properties
            echo storePassword='${{ secrets.KEYSTORE_PASSWORD }}' >> android/key.properties
            echo keyAlias='${{ secrets.KEY_ALIAS }}' >> android/key.properties
            echo keyPassword='${{ secrets.KEY_PASSWORD }}' >> android/key.properties
          fi

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Use the runner's preinstalled NDK
        # Flutter 3.47 默认的 ndkVersion（28.2）不在 GitHub runner 镜像的预装列表里
        # （预装的是 27.3.13750724 / 29.0.14206865 / 30.0.16248370），于是每次构建都要
        # 去 dl.google.com 现下 2.6 GB。那个下载从 2026-10-10 起在 CI 上持续卡死
        # （进度条停在 10~16% 后超时），Android 构建在编译 Dart 之前就全挂。
        # 这里改成复用镜像自带的默认 NDK，构建过程不再依赖网络。
        # 前提：本项目 Android 侧没有 externalNativeBuild / cmake / jniLibs，
        # 构建期不编译原生代码，NDK 仅供 AGP 处理 AAR 内的预编译 .so。
        run: |
          ndk_dir="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK:-}}}"
          ver="$(basename "$ndk_dir")"
          if [ -n "$ver" ] && [ -d "$ndk_dir" ]; then
            echo "使用 runner 预装 NDK：$ver"
            echo "ORG_GRADLE_PROJECT_piliNdkVersion=$ver" >> "$GITHUB_ENV"
          else
            echo "::warning title=NDK::runner 未提供预装 NDK，回退到 Flutter 默认版本（将触发下载）"
          fi
      - name: Flutter Build Release Apk
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: flutter build apk --release --split-per-abi --dart-define-from-file=pili_release.json --pub

      - name: Flutter Build Dev Apk
        if: ${{ github.event_name == 'pull_request' }}
        run: flutter build apk --release --split-per-abi --android-project-arg dev=1 --pub

      - name: Rename APKs
        shell: bash
        run: |
          for file in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(echo "$file" | sed -E 's|.*app-(.*)-release\.apk|\1|')
            mv "$file" "PiliNara_android_${{ env.version }}_${abi}.apk"
          done

      - name: Release
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          target_commitish: ${{ github.sha }}
          files: PiliNara_android_*.apk

      - name: Upload arm64-v8a
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Android_arm64-v8a
          path: PiliNara_android_*_arm64-v8a.apk

      - name: Upload armeabi-v7a
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Android_armeabi-v7a
          path: PiliNara_android_*_armeabi-v7a.apk

      - name: Upload x86_64
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Android_x86_64
          path: PiliNara_android_*_x86_64.apk

  ios:
    if: ${{ (github.event_name == 'pull_request' && github.repository == 'Starfallan/PiliNara') || github.event.inputs.build_ios == 'true' }}
    uses: ./.github/workflows/ios.yml
    permissions: write-all
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

  mac:
    if: ${{ github.event.inputs.build_mac == 'true' }}
    uses: ./.github/workflows/mac.yml
    permissions: write-all
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

  win_x64:
    if: ${{ (github.event_name == 'pull_request' && github.repository == 'Starfallan/PiliNara') || github.event.inputs.build_win_x64 == 'true' }}
    uses: ./.github/workflows/win_x64.yml
    permissions: write-all
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}

  linux_x64:
    if: ${{ github.event.inputs.build_linux_x64 == 'true' }}
    uses: ./.github/workflows/linux_x64.yml
    permissions: write-all
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || '' }}
