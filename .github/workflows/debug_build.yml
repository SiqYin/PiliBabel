name: Debug Build

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android debug APK"
        required: false
        default: false
        type: boolean
      build_win_x64:
        description: "Build Windows x64 debug package"
        required: false
        default: true
        type: boolean

jobs:
  android_debug:
    if: ${{ inputs.build_android }}
    name: Debug Android
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android
        continue-on-error: true

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Cache Android NDK
        # Flutter 要的 NDK 28.2 不在 runner 镜像预装列表里（预装 27.3 / 29.0 / 30.0），
        # 每次构建都要现下约 2.6 GB，而这个下载在 CI 上时好时坏（2026-10-10 期间连续
        # 多轮卡在 10~16% 后超时）。这里把成功下载的那份缓存下来，之后的构建就不再
        # 依赖网络。不能靠改 ndkVersion 绕开：app_links 与 android_file_picker 都
        # 声明需要 28.2，AGP 要求工程与所有插件的 NDK 版本一致，改低会直接报
        # "Your project is configured with Android NDK ..."。
        # key 用 pubspec 的哈希：NDK 版本由 Flutter 决定，而 pubspec 钉死了 flutter
        # 版本，Flutter 一升级缓存即自动失效。路径即 runner 镜像的 ANDROID_HOME。
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: android-ndk-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}

      - name: Flutter Build Debug APK
        run: flutter build apk --debug --dart-define-from-file=pili_release.json --pub

      - name: Prepare Upload
        shell: bash
        run: |
          mkdir -p output
          mv build/app/outputs/flutter-apk/app-debug.apk "output/PiliNara_android_${{ env.version }}_debug.apk"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Android-debug-apk
          path: output/PiliNara_android_*_debug.apk

  win_x64_debug:
    if: ${{ inputs.build_win_x64 }}
    name: Debug Windows x64
    runs-on: windows-latest
    permissions: write-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Flutter Build Windows Debug
        run: flutter build windows --debug --dart-define-from-file=pili_release.json --pub

      - name: Prepare Upload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "PiliNara-Windows-Debug"
          Copy-Item -Recurse -Force "build/windows/x64/runner/Debug/*" "PiliNara-Windows-Debug/"
          Compress-Archive -Path "PiliNara-Windows-Debug" -DestinationPath "PiliNara_windows_${{ env.version }}_x64_debug.zip" -Force

      - name: Upload Windows debug package
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-x64-debug
          path: PiliNara_windows_*_x64_debug.zip
