name: Debug Build

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build Android debug APK"
        required: false
        default: false
        type: boolean
      build_win_x64:
        description: "Build Windows x64 debug package"
        required: false
        default: true
        type: boolean

jobs:
  android_debug:
    if: ${{ inputs.build_android }}
    name: Debug Android
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 android
        continue-on-error: true

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      - name: Use the runner's preinstalled NDK
        # Flutter 3.47 默认的 ndkVersion（28.2）不在 GitHub runner 镜像的预装列表里
        # （预装的是 27.3.13750724 / 29.0.14206865 / 30.0.16248370），于是每次构建都要
        # 去 dl.google.com 现下 2.6 GB。那个下载从 2026-10-10 起在 CI 上持续卡死
        # （进度条停在 10~16% 后超时），Android 构建在编译 Dart 之前就全挂。
        # 这里改成复用镜像自带的默认 NDK，构建过程不再依赖网络。
        # 前提：本项目 Android 侧没有 externalNativeBuild / cmake / jniLibs，
        # 构建期不编译原生代码，NDK 仅供 AGP 处理 AAR 内的预编译 .so。
        run: |
          ndk_dir="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK:-}}}"
          ver="$(basename "$ndk_dir")"
          if [ -n "$ver" ] && [ -d "$ndk_dir" ]; then
            echo "使用 runner 预装 NDK：$ver"
            echo "ORG_GRADLE_PROJECT_piliNdkVersion=$ver" >> "$GITHUB_ENV"
          else
            echo "::warning title=NDK::runner 未提供预装 NDK，回退到 Flutter 默认版本（将触发下载）"
          fi
      - name: Flutter Build Debug APK
        run: flutter build apk --debug --dart-define-from-file=pili_release.json --pub

      - name: Prepare Upload
        shell: bash
        run: |
          mkdir -p output
          mv build/app/outputs/flutter-apk/app-debug.apk "output/PiliNara_android_${{ env.version }}_debug.apk"

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Android-debug-apk
          path: output/PiliNara_android_*_debug.apk

  win_x64_debug:
    if: ${{ inputs.build_win_x64 }}
    name: Debug Windows x64
    runs-on: windows-latest
    permissions: write-all

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 windows

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Flutter Build Windows Debug
        run: flutter build windows --debug --dart-define-from-file=pili_release.json --pub

      - name: Prepare Upload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "PiliNara-Windows-Debug"
          Copy-Item -Recurse -Force "build/windows/x64/runner/Debug/*" "PiliNara-Windows-Debug/"
          Compress-Archive -Path "PiliNara-Windows-Debug" -DestinationPath "PiliNara_windows_${{ env.version }}_x64_debug.zip" -Force

      - name: Upload Windows debug package
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Windows-x64-debug
          path: PiliNara_windows_*_x64_debug.zip
