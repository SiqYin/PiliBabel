name: Diag analyze

on:
  push:
    branches:
      - 'diag/**'

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev webkit2gtk-4.1 libasound2-dev libmpv-dev
        shell: bash

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1

      - name: Apply Patch
        shell: pwsh
        run: lib/scripts/patch.ps1 Linux

      - name: Analyze and report
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flutter analyze --no-pub > /tmp/an.txt 2>&1 || true

          # errors
          grep -E 'error( .|$)' /tmp/an.txt > /tmp/an_err.txt || true
          grep -cE 'error( .|$)' /tmp/an.txt > /tmp/an_cnt.txt || true

          # warnings / infos —— 用于清单第 68 条「analyze 尾巴」的清理
          grep -E 'warning( .|$)' /tmp/an.txt > /tmp/an_warn.txt || true
          grep -E 'info( .|$)' /tmp/an.txt > /tmp/an_info.txt || true
          grep -cE 'warning( .|$)' /tmp/an.txt > /tmp/an_wcnt.txt || true
          grep -cE 'info( .|$)' /tmp/an.txt > /tmp/an_icnt.txt || true

          # 按 lint 类型聚合，直接给出每条规则的剩余量
          # 行格式：warning • <message> • <path:line:col> • <rule_name>
          # 规则名恒为该行最后一个空格分隔字段，用 rev+cut 取最可靠
          rev /tmp/an_warn.txt 2>/dev/null | cut -d' ' -f1 | sort | uniq -c | sort -rn > /tmp/an_wrules.txt || true
          rev /tmp/an_info.txt 2>/dev/null | cut -d' ' -f1 | sort | uniq -c | sort -rn > /tmp/an_irules.txt || true

          tail -c 20000 /tmp/an_err.txt > /tmp/an_err_tail.txt
          head -c 30000 /tmp/an_warn.txt > /tmp/an_warn_tail.txt
          head -c 30000 /tmp/an_info.txt > /tmp/an_info_tail.txt

          # 定向提取「有正确性意义」的 lint 明细（清单第 68 条点名的那批）
          {
            for rule in use_build_context_synchronously avoid_void_async \
                        unnecessary_async cancel_subscriptions \
                        no_leading_underscores_for_local_identifiers \
                        package_names unnecessary_parenthesis \
                        unnecessary_import prefer_initializing_formals \
                        library_private_types_in_public_api \
                        constant_identifier_names; do
              echo "### $rule"
              grep -E " $rule\$" /tmp/an_info.txt /tmp/an_warn.txt 2>/dev/null || echo "  (none)"
            done
          } > /tmp/an_targeted.txt 2>&1 || true

          {
            echo "### flutter analyze summary"
            echo ""
            echo "- errors: $(cat /tmp/an_cnt.txt 2>/dev/null || echo 0)"
            echo "- warnings: $(cat /tmp/an_wcnt.txt 2>/dev/null || echo 0)"
            echo "- infos: $(cat /tmp/an_icnt.txt 2>/dev/null || echo 0)"
            echo ""
            echo "#### warnings 按规则聚合（数量  规则）"
            echo '```'
            head -c 8000 /tmp/an_wrules.txt 2>/dev/null || true
            echo '```'
            echo ""
            echo "#### infos 按规则聚合（数量  规则）"
            echo '```'
            head -c 12000 /tmp/an_irules.txt 2>/dev/null || true
            echo '```'
            echo ""
            echo "#### warnings 明细"
            echo '```'
            head -c 30000 /tmp/an_warn_tail.txt 2>/dev/null || true
            echo '```'
            echo ""
            echo "#### infos 明细"
            echo '```'
            head -c 30000 /tmp/an_info_tail.txt 2>/dev/null || true
            echo '```'
            echo ""
            echo "#### 定向规则明细（正确性相关）"
            echo '```'
            head -c 20000 /tmp/an_targeted.txt 2>/dev/null || true
            echo '```'
          } > /tmp/body.md

          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@/tmp/body.md || true
          echo "---- summary ----"
          cat /tmp/an_cnt.txt /tmp/an_wcnt.txt /tmp/an_icnt.txt
          echo "---- rules tail ----"
          tail -n 60 /tmp/an_rules.txt 2>/dev/null || true
