name: Android Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    # 允许手动触发构建

jobs:
  android-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 代码迁出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建Java环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      # 保留你原有的 Patch 逻辑
      - name: revert new overscrollindicator
        working-directory: ${{ env.FLUTTER_ROOT }}
        run: |
          git config --global user.name "ci"
          git config --global user.email "example@example.com"
          git stash || true
          git revert 362b1de29974ffc1ed6faa826e1df870d7bec75f --no-edit
          git reset --soft HEAD~1
          git stash pop || true
        continue-on-error: true

      - name: apply patches
        working-directory: ${{ env.FLUTTER_ROOT }}
        run: |
          git apply $GITHUB_WORKSPACE/lib/scripts/bottom_sheet_patch.diff || true
          git apply $GITHUB_WORKSPACE/lib/scripts/modal_barrier_patch.diff || true
          git apply $GITHUB_WORKSPACE/lib/scripts/mouse_cursor_patch.diff || true

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      # 核心修改点：使用 --debug 模式
      # 注意：Debug 模式下通常不使用 --split-per-abi，因为它会生成一个包含全架构的胖 APK
      - name: Cache Android NDK
        # Flutter 要的 NDK 28.2 不在 runner 镜像预装列表里（预装 27.3 / 29.0 / 30.0），
        # 每次构建都要现下约 2.6 GB，而这个下载在 CI 上时好时坏（2026-10-10 期间连续
        # 多轮卡在 10~16% 后超时）。这里把成功下载的那份缓存下来，之后的构建就不再
        # 依赖网络。不能靠改 ndkVersion 绕开：app_links 与 android_file_picker 都
        # 声明需要 28.2，AGP 要求工程与所有插件的 NDK 版本一致，改低会直接报
        # "Your project is configured with Android NDK ..."。
        # key 用 pubspec 的哈希：NDK 版本由 Flutter 决定，而 pubspec 钉死了 flutter
        # 版本，Flutter 一升级缓存即自动失效。路径即 runner 镜像的 ANDROID_HOME。
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: /usr/local/lib/android/sdk/ndk
          key: android-ndk-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}

      - name: Flutter Build Debug APK
        run: |
          flutter build apk --debug --dart-define-from-file=pili_release.json --pub

      - name: Rename Debug APK
        run: |
          mkdir -p output
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            mv "build/app/outputs/flutter-apk/app-debug.apk" "output/PiliNara_android_debug_all.apk"
          fi
        shell: bash

      - name: 上传 Debug 产物
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Android_Debug_APK
          path: output/PiliNara_android_debug_all.apk