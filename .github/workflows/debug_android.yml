name: Android Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
  workflow_dispatch:
    # 允许手动触发构建

jobs:
  android-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 代码迁出
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 构建Java环境
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"
          cache: "gradle"
          cache-dependency-path: |
            android/*.gradle*
            android/**/gradle-wrapper.properties

      - name: 安装Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      # 保留你原有的 Patch 逻辑
      - name: revert new overscrollindicator
        working-directory: ${{ env.FLUTTER_ROOT }}
        run: |
          git config --global user.name "ci"
          git config --global user.email "example@example.com"
          git stash || true
          git revert 362b1de29974ffc1ed6faa826e1df870d7bec75f --no-edit
          git reset --soft HEAD~1
          git stash pop || true
        continue-on-error: true

      - name: apply patches
        working-directory: ${{ env.FLUTTER_ROOT }}
        run: |
          git apply $GITHUB_WORKSPACE/lib/scripts/bottom_sheet_patch.diff || true
          git apply $GITHUB_WORKSPACE/lib/scripts/modal_barrier_patch.diff || true
          git apply $GITHUB_WORKSPACE/lib/scripts/mouse_cursor_patch.diff || true

      - name: Set and Extract version
        shell: pwsh
        run: lib/scripts/build.ps1 android

      # 核心修改点：使用 --debug 模式
      # 注意：Debug 模式下通常不使用 --split-per-abi，因为它会生成一个包含全架构的胖 APK
      - name: Use the runner's preinstalled NDK
        # Flutter 3.47 默认的 ndkVersion（28.2）不在 GitHub runner 镜像的预装列表里
        # （预装的是 27.3.13750724 / 29.0.14206865 / 30.0.16248370），于是每次构建都要
        # 去 dl.google.com 现下 2.6 GB。那个下载从 2026-10-10 起在 CI 上持续卡死
        # （进度条停在 10~16% 后超时），Android 构建在编译 Dart 之前就全挂。
        # 这里改成复用镜像自带的默认 NDK，构建过程不再依赖网络。
        # 前提：本项目 Android 侧没有 externalNativeBuild / cmake / jniLibs，
        # 构建期不编译原生代码，NDK 仅供 AGP 处理 AAR 内的预编译 .so。
        run: |
          ndk_dir="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-${ANDROID_NDK:-}}}"
          ver="$(basename "$ndk_dir")"
          if [ -n "$ver" ] && [ -d "$ndk_dir" ]; then
            echo "使用 runner 预装 NDK：$ver"
            echo "ORG_GRADLE_PROJECT_piliNdkVersion=$ver" >> "$GITHUB_ENV"
          else
            echo "::warning title=NDK::runner 未提供预装 NDK，回退到 Flutter 默认版本（将触发下载）"
          fi
      - name: Flutter Build Debug APK
        run: |
          flutter build apk --debug --dart-define-from-file=pili_release.json --pub

      - name: Rename Debug APK
        run: |
          mkdir -p output
          if [ -f "build/app/outputs/flutter-apk/app-debug.apk" ]; then
            mv "build/app/outputs/flutter-apk/app-debug.apk" "output/PiliNara_android_debug_all.apk"
          fi
        shell: bash

      - name: 上传 Debug 产物
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: Android_Debug_APK
          path: output/PiliNara_android_debug_all.apk